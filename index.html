<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <meta name="telegram-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>CryptoPulse</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #1a2332;
            --bg-card: #1e293b;
            --bg-hover: #273548;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #334155;
            --radius: 12px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .header {
            background: var(--bg-secondary);
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .watchlist-count-badge {
            background: var(--accent);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .nav-tabs {
            display: flex;
            background: var(--bg-secondary);
            padding: 8px;
            gap: 4px;
            position: sticky;
            top: 57px;
            z-index: 99;
            border-bottom: 1px solid var(--border);
        }

        .nav-tab {
            flex: 1;
            padding: 10px 8px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .nav-tab.active {
            background: var(--accent);
            color: white;
        }

        .tab-content {
            display: none;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .global-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .global-stat {
            background: var(--bg-card);
            padding: 14px;
            border-radius: var(--radius);
            text-align: center;
        }

        .global-stat .label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .global-stat .value {
            font-size: 16px;
            font-weight: 700;
        }

        .global-stat .change {
            font-size: 12px;
            margin-top: 4px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-header h2 {
            font-size: 18px;
            font-weight: 700;
        }

        .filters {
            display: flex;
            gap: 6px;
        }

        .filter-btn {
            padding: 6px 14px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .coins-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .coin-card {
            background: var(--bg-card);
            padding: 16px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .coin-card:hover {
            background: var(--bg-hover);
            border-color: var(--border);
        }

        .coin-rank {
            font-size: 13px;
            color: var(--text-secondary);
            min-width: 28px;
            text-align: center;
        }

        .coin-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .coin-icon img {
            width: 28px;
            height: 28px;
        }

        .coin-info {
            flex: 1;
            min-width: 0;
            cursor: pointer;
        }

        .coin-name {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 2px;
        }

        .coin-symbol {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .coin-price-section {
            text-align: right;
            cursor: pointer;
        }

        .coin-price {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .coin-change {
            font-size: 13px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            display: inline-block;
        }

        .coin-change.positive {
            color: var(--success);
            background: rgba(34, 197, 94, 0.1);
        }

        .coin-change.negative {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
        }

        .watchlist-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
            line-height: 1;
        }

        .watchlist-btn:hover {
            background: var(--bg-hover);
        }

        .watchlist-btn.in-watchlist {
            color: #f59e0b;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            border-radius: var(--radius);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .search-box button {
            padding: 14px 20px;
            background: var(--accent);
            border: none;
            border-radius: var(--radius);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-box button:hover {
            background: var(--accent-hover);
        }

        .search-results {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .profile-card {
            background: var(--bg-card);
            padding: 28px;
            border-radius: var(--radius);
            text-align: center;
            margin-bottom: 16px;
        }

        .profile-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 16px;
        }

        .profile-card h3 {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .profile-card p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: var(--radius);
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: flex-end;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: var(--radius) var(--radius) 0 0;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUpContent 0.3s ease;
        }

        @keyframes slideUpContent {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--bg-secondary);
            z-index: 10;
        }

        .modal-back {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
        }

        .modal-title {
            flex: 1;
            text-align: center;
            font-weight: 700;
            font-size: 16px;
        }

        .modal-action {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
        }

        .modal-action.active {
            color: #f59e0b;
        }

        .modal-body {
            padding: 20px;
        }

        .chart-container {
            background: var(--bg-card);
            padding: 20px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            height: 300px;
        }

        .coin-detail-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .coin-detail-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .coin-detail-icon img {
            width: 36px;
            height: 36px;
        }

        .coin-detail-info h2 {
            font-size: 22px;
            margin-bottom: 4px;
        }

        .coin-detail-info p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .coin-detail-price {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .coin-detail-change {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .stat-box {
            background: var(--bg-card);
            padding: 16px;
            border-radius: var(--radius);
        }

        .stat-box .label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .stat-box .value {
            font-size: 16px;
            font-weight: 700;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 14px 24px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s ease;
            border: 1px solid var(--border);
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-color: var(--success);
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
        }

        .toast.error {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .hidden {
            display: none !important;
        }

        .positive { color: var(--success); }
        .negative { color: var(--danger); }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-state .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        @media (max-width: 480px) {
            .nav-tab {
                font-size: 11px;
                padding: 8px 4px;
            }
            .coin-price {
                font-size: 13px;
            }
            .global-stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="header-content">
                <h1>💎 CryptoPulse</h1>
                <span class="watchlist-count-badge" id="headerWatchlistCount">⭐ 0</span>
            </div>
        </header>

        <nav class="nav-tabs">
            <button class="nav-tab active" data-tab="market">📊 Рынок</button>
            <button class="nav-tab" data-tab="search">🔍 Поиск</button>
            <button class="nav-tab" data-tab="watchlist">⭐ Избранное</button>
            <button class="nav-tab" data-tab="profile">👤 Профиль</button>
        </nav>

        <div class="tab-content active" id="marketTab">
            <div class="global-stats" id="globalStats">
                <div class="global-stat"><div class="label">Загрузка...</div></div>
            </div>
            <div class="section-header">
                <h2>🔥 Топ криптовалют</h2>
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">Все</button>
                    <button class="filter-btn" data-filter="gainers">Рост</button>
                    <button class="filter-btn" data-filter="losers">Падение</button>
                </div>
            </div>
            <div class="coins-list" id="coinsList">
                <div class="loading">Загрузка...</div>
            </div>
        </div>

        <div class="tab-content" id="searchTab">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Поиск монеты..." autocomplete="off">
                <button id="searchBtn">🔍</button>
            </div>
            <div class="search-results" id="searchResults"></div>
        </div>

        <div class="tab-content" id="watchlistTab">
            <div class="section-header">
                <h2>⭐ Избранное</h2>
                <button class="filter-btn" onclick="clearWatchlist()">🗑 Очистить</button>
            </div>
            <div class="coins-list" id="watchlistList">
                <div class="loading">Загрузка...</div>
            </div>
        </div>

        <div class="tab-content" id="profileTab">
            <div class="profile-card">
                <div class="profile-avatar" id="profileAvatar">👤</div>
                <h3 id="profileName">Пользователь</h3>
                <p id="profileUsername"></p>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="watchlistCount">0</div>
                    <div class="stat-label">В избранном</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalRequests">0</div>
                    <div class="stat-label">Запросов сегодня</div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="coinModal">
        <div class="modal-content">
            <div class="modal-header">
                <button class="modal-back" onclick="closeCoinDetailModal()">←</button>
                <div class="modal-title" id="modalTitle">Детали монеты</div>
                <button class="modal-action" id="modalWatchlistBtn" onclick="toggleWatchlistFromModal()">⭐</button>
            </div>
            <div class="modal-body" id="modalBody">
                <div class="loading">Загрузка...</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    // CoinPaprika API base URL
    const COINPAPRIKA_API = 'https://api.coinpaprika.com/v1';

    let tg = null;
    try {
        if (window.Telegram && window.Telegram.WebApp) {
            tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#0f1419');
            tg.setBackgroundColor('#0f1419');
            tg.enableClosingConfirmation();
        }
    } catch (e) {
        console.log('Telegram WebApp not available');
    }

    let currentCoinId = null;
    let currentCoinData = null;
    let allCoins = [];
    let chartInstance = null;
    let chartLoadTimeout = null;

    const CACHE_TTL = 60 * 1000;
    let apiCache = {};

    function getCache(key) {
        const item = apiCache[key];
        if (!item) return null;
        if (Date.now() - item.time > CACHE_TTL) {
            delete apiCache[key];
            return null;
        }
        return item.data;
    }

    function setCache(key, data) {
        apiCache[key] = { time: Date.now(), data: data };
    }

    function getStorage(key, def) {
        try {
            const value = localStorage.getItem('cryptopulse_' + key);
            return value ? JSON.parse(value) : def;
        } catch (e) {
            return def;
        }
    }

    function setStorage(key, val) {
        try {
            localStorage.setItem('cryptopulse_' + key, JSON.stringify(val));
        } catch (e) {
            console.error('Storage error:', e);
        }
    }

    let watchlist = getStorage('watchlist', []);
    let dailyRequests = getStorage('daily_requests', 0);
    let lastRequestDate = getStorage('last_request_date', null);

    const today = new Date().toDateString();
    if (lastRequestDate !== today) {
        dailyRequests = 0;
        setStorage('daily_requests', 0);
        setStorage('last_request_date', today);
    }

    document.addEventListener('DOMContentLoaded', () => {
        console.log('App initialized with CoinPaprika API');
        console.log('Watchlist from storage:', watchlist);

        initNavigation();
        initSearch();
        loadGlobalStats();
        loadTopCoins();
        updateAllUI();
    });

    function updateAllUI() {
        updateWatchlistCounters();
        updateProfileUI();
    }

    function updateWatchlistCounters() {
        const count = watchlist.length;
        document.getElementById('headerWatchlistCount').textContent = '⭐ ' + count;
        document.getElementById('watchlistCount').textContent = count;
    }

    function updateProfileUI() {
        const user = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
        document.getElementById('profileName').textContent = user ? (user.first_name || 'Пользователь') : 'Гость';
        document.getElementById('profileUsername').textContent = user && user.username ? '@' + user.username : '';
        document.getElementById('totalRequests').textContent = dailyRequests;
    }

    function updateModalWatchlistButton() {
        const btn = document.getElementById('modalWatchlistBtn');
        if (btn && currentCoinId) {
            const isInWatchlist = watchlist.includes(currentCoinId);
            btn.classList.toggle('active', isInWatchlist);
            btn.textContent = isInWatchlist ? '⭐' : '☆';
        }
    }

    function initNavigation() {
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const tabName = tab.dataset.tab;
                switchTab(tabName);
            });
        });

        document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                filterCoins(e.target.dataset.filter);
            });
        });
    }

    function switchTab(tabName) {
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));

        const tabButton = document.querySelector(`[data-tab="${tabName}"]`);
        const tabContent = document.getElementById(tabName + 'Tab');

        if (tabButton) tabButton.classList.add('active');
        if (tabContent) tabContent.classList.add('active');

        if (tabName === 'watchlist') {
            loadWatchlist();
        }
    }

    function incrementRequestCount() {
        dailyRequests++;
        setStorage('daily_requests', dailyRequests);
        document.getElementById('totalRequests').textContent = dailyRequests;
    }

    // Generic API fetch function for CoinPaprika
    async function cpGet(endpoint, useCache = true, retries = 1) {
        const url = COINPAPRIKA_API + endpoint;
        const cacheKey = url;

        if (useCache) {
            const cached = getCache(cacheKey);
            if (cached) {
                console.log('Using cache for:', endpoint);
                return cached;
            }
        }

        try {
            console.log('Fetching:', url);
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);
            const res = await fetch(url, { signal: controller.signal });
            clearTimeout(timeoutId);

            if (res.status === 429) {
                if (retries > 0) {
                    console.log('429 received, retrying in 2s...');
                    showToast('Лимит API. Повтор через 2 сек...', 'error');
                    await new Promise(r => setTimeout(r, 2000));
                    return cpGet(endpoint, useCache, retries - 1);
                }
                showToast('Слишком много запросов. Подождите минуту.', 'error');
                return null;
            }
            if (!res.ok) throw new Error('API Error ' + res.status);

            const data = await res.json();
            setCache(cacheKey, data);
            incrementRequestCount();
            return data;
        } catch (e) {
            console.error('API Error:', e);
            showToast('Ошибка загрузки данных', 'error');
            return null;
        }
    }

    async function loadGlobalStats() {
        const data = await cpGet('/global', true);
        if (!data) return;

        document.getElementById('globalStats').innerHTML = `
            <div class="global-stat">
                <div class="label">Капитализация</div>
                <div class="value">$${formatNumber(data.market_cap_usd)}</div>
                <div class="change ${data.market_cap_change_24h >= 0 ? 'positive' : 'negative'}">
                    ${data.market_cap_change_24h >= 0 ? '+' : ''}${data.market_cap_change_24h.toFixed(2)}%
                </div>
            </div>
            <div class="global-stat">
                <div class="label">Объём 24ч</div>
                <div class="value">$${formatNumber(data.volume_24h_usd)}</div>
            </div>
            <div class="global-stat">
                <div class="label">Доминация BTC</div>
                <div class="value">${data.bitcoin_dominance_percentage.toFixed(1)}%</div>
            </div>`;
    }

    async function loadTopCoins() {
        const data = await cpGet('/tickers?quotes=USD', true);
        if (!data) return;

        // CoinPaprika returns all tickers, take top 50 and transform to our format
        allCoins = data.slice(0, 50).map(ticker => ({
            id: ticker.id,
            name: ticker.name,
            symbol: ticker.symbol,
            rank: ticker.rank,
            current_price: ticker.quotes.USD.price,
            market_cap: ticker.quotes.USD.market_cap,
            price_change_percentage_24h: ticker.quotes.USD.percent_change_24h,
            total_volume: ticker.quotes.USD.volume_24h,
            image: `https://static.coinpaprika.com/coin/${ticker.id}/logo.png`
        }));

        renderCoinsList(allCoins, 'coinsList');
    }

    function renderCoinsList(coins, containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;

        if (!coins || !coins.length) {
            container.innerHTML = '<div class="loading">Нет данных</div>';
            return;
        }

        container.innerHTML = coins.map(coin => {
            const isInWatchlist = watchlist.includes(coin.id);
            return createCoinCardHTML(coin, isInWatchlist);
        }).join('');
    }

    function createCoinCardHTML(coin, isInWatchlist) {
        const change = coin.price_change_percentage_24h || 0;
        const changeClass = change >= 0 ? 'positive' : 'negative';
        const symbol = (coin.symbol || '?').toUpperCase();
        const firstLetter = symbol.charAt(0);

        return `
        <div class="coin-card">
            <div class="coin-rank">${coin.rank || '-'}</div>
            <div class="coin-icon">
                <img src="${coin.image || ''}" 
                     alt="${coin.name || 'Coin'}" 
                     loading="lazy" 
                     onerror="this.style.display='none';this.parentElement.textContent='${firstLetter}'">
            </div>
            <div class="coin-info" onclick="openCoinDetail('${coin.id}')">
                <div class="coin-name">${coin.name || 'Unknown'}</div>
                <div class="coin-symbol">${symbol}</div>
            </div>
            <div class="coin-price-section" onclick="openCoinDetail('${coin.id}')">
                <div class="coin-price">$${formatPrice(coin.current_price)}</div>
                <div class="coin-change ${changeClass}">
                    ${change >= 0 ? '+' : ''}${change.toFixed(2)}%
                </div>
            </div>
            <button class="watchlist-btn ${isInWatchlist ? 'in-watchlist' : ''}" 
                    onclick="event.stopPropagation(); toggleWatchlist('${coin.id}', '${escapeHtml(coin.name || 'Unknown')}')" 
                    title="${isInWatchlist ? 'Удалить из избранного' : 'Добавить в избранное'}">
                ${isInWatchlist ? '⭐' : '☆'}
            </button>
        </div>`;
    }

    function filterCoins(filter) {
        if (!allCoins.length) return;

        let filtered = [...allCoins];
        if (filter === 'gainers') {
            filtered = filtered
                .filter(c => c.price_change_percentage_24h > 0)
                .sort((a, b) => b.price_change_percentage_24h - a.price_change_percentage_24h);
        } else if (filter === 'losers') {
            filtered = filtered
                .filter(c => c.price_change_percentage_24h < 0)
                .sort((a, b) => a.price_change_percentage_24h - b.price_change_percentage_24h);
        }

        renderCoinsList(filtered, 'coinsList');
    }

    function initSearch() {
        const input = document.getElementById('searchInput');
        const btn = document.getElementById('searchBtn');
        let searchTimer;

        input.addEventListener('input', () => {
            clearTimeout(searchTimer);
            const query = input.value.trim();
            if (query.length > 1) {
                searchTimer = setTimeout(() => searchCoins(query), 400);
            } else {
                document.getElementById('searchResults').innerHTML = '';
            }
        });

        btn.addEventListener('click', () => {
            const query = input.value.trim();
            if (query.length > 1) searchCoins(query);
        });

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = input.value.trim();
                if (query.length > 1) searchCoins(query);
            }
        });
    }

    async function searchCoins(query) {
        const container = document.getElementById('searchResults');
        container.innerHTML = '<div class="loading">Поиск...</div>';

        // CoinPaprika search endpoint
        const data = await cpGet('/search?q=' + encodeURIComponent(query) + '&c=coins&limit=20', false);
        if (!data || !data.coins) {
            container.innerHTML = '<div class="loading">Ошибка поиска</div>';
            return;
        }

        if (!data.coins.length) {
            container.innerHTML = '<div class="loading">Ничего не найдено</div>';
            return;
        }

        container.innerHTML = data.coins.slice(0, 20).map(c => {
            const isInWatchlist = watchlist.includes(c.id);
            return `
            <div class="coin-card">
                <div class="coin-icon">
                    <img src="https://static.coinpaprika.com/coin/${c.id}/logo.png" 
                         alt="${c.name || 'Coin'}" 
                         loading="lazy" 
                         onerror="this.style.display='none';this.parentElement.textContent='${(c.symbol || '?').charAt(0).toUpperCase()}'">
                </div>
                <div class="coin-info" onclick="openCoinDetail('${c.id}')">
                    <div class="coin-name">${c.name || 'Unknown'}</div>
                    <div class="coin-symbol">${(c.symbol || '?').toUpperCase()}</div>
                </div>
                <div class="coin-price-section" onclick="openCoinDetail('${c.id}')">
                    <span style="color:var(--text-secondary);font-size:13px;">#${c.rank || '-'}</span>
                </div>
                <button class="watchlist-btn ${isInWatchlist ? 'in-watchlist' : ''}" 
                        onclick="event.stopPropagation(); toggleWatchlist('${c.id}', '${escapeHtml(c.name || 'Unknown')}')" 
                        title="${isInWatchlist ? 'Удалить из избранного' : 'Добавить в избранное'}">
                    ${isInWatchlist ? '⭐' : '☆'}
                </button>
            </div>`;
        }).join('');
    }

    async function openCoinDetail(coinId) {
        console.log('Opening coin detail:', coinId);
        currentCoinId = coinId;
        currentCoinData = null;

        if (chartLoadTimeout) {
            clearTimeout(chartLoadTimeout);
            chartLoadTimeout = null;
        }

        if (chartInstance) {
            try { chartInstance.destroy(); } catch (e) {}
            chartInstance = null;
        }

        document.getElementById('coinModal').classList.add('active');
        document.getElementById('modalBody').innerHTML = '<div class="loading">Загрузка...</div>';
        document.getElementById('modalTitle').textContent = 'Загрузка...';
        updateModalWatchlistButton();

        // Fetch coin detail from CoinPaprika
        const coin = await cpGet('/coins/' + coinId, true);

        if (currentCoinId !== coinId) return;

        if (!coin) {
            document.getElementById('modalBody').innerHTML = '<div class="loading">Ошибка загрузки. Попробуйте позже.</div>';
            return;
        }

        // Also fetch ticker data for price info
        const tickerData = await cpGet('/tickers/' + coinId + '?quotes=USD', true);
        
        if (currentCoinId !== coinId) return;

        // Merge coin info with ticker data
        const coinWithMarketData = {
            ...coin,
            quotes: tickerData ? tickerData.quotes : null,
            rank: tickerData ? tickerData.rank : coin.rank
        };

        currentCoinData = coinWithMarketData;
        renderCoinDetail(coinWithMarketData);
        updateModalWatchlistButton();

        chartLoadTimeout = setTimeout(() => loadCoinChart(coinId), 100);
    }

    function renderCoinDetail(coin) {
        const symbol = (coin.symbol || '?').toUpperCase();
        const logoUrl = `https://static.coinpaprika.com/coin/${coin.id}/logo.png`;
        
        document.getElementById('modalTitle').innerHTML = `
            <img src="${logoUrl}" 
                 style="width:24px;height:24px;vertical-align:middle;margin-right:8px;border-radius:50%;"
                 onerror="this.style.display='none'">
            ${coin.name || 'Unknown'} (${symbol})`;

        const quotes = coin.quotes?.USD || {};
        const price = quotes.price || 0;
        const change24h = quotes.percent_change_24h || 0;
        const changeClass = change24h >= 0 ? 'positive' : 'negative';
        const changeBg = change24h >= 0 ? 'rgba(34,197,94,0.1)' : 'rgba(239,68,68,0.1)';
        const marketCap = quotes.market_cap || 0;
        const volume24h = quotes.volume_24h || 0;
        const ath = quotes.ath_price || 0;
        const circulatingSupply = coin.circulating_supply || 0;

        document.getElementById('modalBody').innerHTML = `
            <div class="coin-detail-header">
                <div class="coin-detail-icon">
                    <img src="${logoUrl}" 
                         alt="${coin.name || 'Coin'}"
                         onerror="this.style.display='none';this.parentElement.textContent='${symbol.charAt(0)}'">
                </div>
                <div class="coin-detail-info">
                    <h2>${coin.name || 'Unknown'}</h2>
                    <p>${symbol} • Rank #${coin.rank || '-'}</p>
                </div>
            </div>
            <div class="coin-detail-price">$${formatPrice(price)}</div>
            <div class="coin-detail-change ${changeClass}" style="background:${changeBg}">
                ${change24h >= 0 ? '+' : ''}${change24h.toFixed(2)}% (24ч)
            </div>
            <div class="chart-container">
                <canvas id="priceChart"></canvas>
            </div>
            <div class="stats-row">
                <div class="stat-box">
                    <div class="label">Рыночная капитализация</div>
                    <div class="value">$${formatNumber(marketCap)}</div>
                </div>
                <div class="stat-box">
                    <div class="label">Объём торгов 24ч</div>
                    <div class="value">$${formatNumber(volume24h)}</div>
                </div>
                <div class="stat-box">
                    <div class="label">Исторический максимум</div>
                    <div class="value">$${formatPrice(ath)}</div>
                </div>
                <div class="stat-box">
                    <div class="label">В обращении</div>
                    <div class="value">${formatNumber(circulatingSupply)} ${symbol}</div>
                </div>
            </div>`;
    }

    async function loadCoinChart(coinId, days = 7) {
        if (currentCoinId !== coinId) return;

        const canvas = document.getElementById('priceChart');
        if (!canvas) return;

        if (chartInstance) {
            try { chartInstance.destroy(); } catch (e) { console.error('Chart destroy error:', e); }
            chartInstance = null;
        }

        // CoinPaprika uses different time intervals
        let endpoint;
        if (days <= 1) {
            endpoint = '/coins/' + coinId + '/ohlcv/historical?start=' + 
                new Date(Date.now() - days * 24 * 60 * 60 * 1000).toISOString().split('T')[0] + 
                '&limit=24';
        } else if (days <= 7) {
            endpoint = '/coins/' + coinId + '/ohlcv/historical?start=' + 
                new Date(Date.now() - days * 24 * 60 * 60 * 1000).toISOString().split('T')[0] + 
                '&limit=168';
        } else {
            endpoint = '/coins/' + coinId + '/ohlcv/historical?start=' + 
                new Date(Date.now() - days * 24 * 60 * 60 * 1000).toISOString().split('T')[0] + 
                '&limit=365';
        }

        const data = await cpGet(endpoint, true);

        if (currentCoinId !== coinId) return;
        if (!document.getElementById('coinModal').classList.contains('active')) return;

        const canvasCheck = document.getElementById('priceChart');
        if (!canvasCheck) return;

        if (!data || !data.length) {
            canvasCheck.parentElement.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-secondary);">График недоступен</div>';
            return;
        }

        const ctx = canvasCheck.getContext('2d');
        // CoinPaprika OHLCV format: [time_open, open, high, low, close, volume, market_cap]
        const prices = data.map(item => ({
            x: new Date(item.time_open).getTime(),
            y: item.close
        }));

        try {
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: 'Цена USD',
                        data: prices,
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59,130,246,0.1)',
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        pointHoverRadius: 6,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { intersect: false, mode: 'index' },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#1e293b',
                            titleColor: '#f1f5f9',
                            bodyColor: '#f1f5f9',
                            borderColor: '#334155',
                            borderWidth: 1,
                            callbacks: {
                                title: (items) => {
                                    if (!items.length) return '';
                                    const d = new Date(items[0].parsed.x);
                                    return d.toLocaleDateString('ru-RU') + ' ' + 
                                           d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                                },
                                label: (ctx) => '$' + formatPrice(ctx.parsed.y)
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            grid: { color: '#334155', drawBorder: false },
                            ticks: {
                                color: '#94a3b8',
                                maxTicksLimit: 8,
                                callback: function(value) {
                                    const d = new Date(value);
                                    return d.toLocaleDateString('ru-RU', { day: '2-digit', month: 'short' });
                                }
                            }
                        },
                        y: {
                            grid: { color: '#334155', drawBorder: false },
                            ticks: {
                                color: '#94a3b8',
                                callback: (v) => '$' + formatPrice(v)
                            }
                        }
                    }
                }
            });
        } catch (e) {
            console.error('Chart error:', e);
            canvasCheck.parentElement.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-secondary);">Ошибка графика</div>';
        }
    }

    function closeCoinDetailModal() {
        if (chartLoadTimeout) {
            clearTimeout(chartLoadTimeout);
            chartLoadTimeout = null;
        }

        document.getElementById('coinModal').classList.remove('active');

        if (chartInstance) {
            try { chartInstance.destroy(); } catch (e) { console.error('Chart destroy error:', e); }
            chartInstance = null;
        }

        currentCoinId = null;
        currentCoinData = null;
    }

    function toggleWatchlist(coinId, coinName) {
        const index = watchlist.indexOf(coinId);

        if (index > -1) {
            watchlist.splice(index, 1);
            showToast('Удалено: ' + coinName, 'success');
        } else {
            if (watchlist.length >= 50) {
                showToast('Лимит: 50 монет', 'error');
                return;
            }
            watchlist.push(coinId);
            showToast('Добавлено: ' + coinName + ' ⭐', 'success');
        }

        setStorage('watchlist', watchlist);
        updateAllUI();

        if (allCoins.length > 0) {
            renderCoinsList(allCoins, 'coinsList');
        }

        updateModalWatchlistButton();

        const watchlistContent = document.getElementById('watchlistTab');
        if (watchlistContent && watchlistContent.classList.contains('active')) {
            loadWatchlist();
        }
    }

    function toggleWatchlistFromModal() {
        if (!currentCoinId || !currentCoinData) return;
        const coinName = currentCoinData.name || currentCoinId;
        toggleWatchlist(currentCoinId, coinName);
    }

    function clearWatchlist() {
        if (watchlist.length === 0) {
            showToast('Избранное пустое', 'error');
            return;
        }

        if (confirm('Удалить все монеты из избранного?')) {
            watchlist = [];
            setStorage('watchlist', watchlist);
            updateAllUI();

            if (allCoins.length > 0) {
                renderCoinsList(allCoins, 'coinsList');
            }

            updateModalWatchlistButton();
            loadWatchlist();
            showToast('Избранное очищено', 'success');
        }
    }

    async function loadWatchlist() {
        const container = document.getElementById('watchlistList');
        if (!container) return;

        if (!watchlist || watchlist.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">⭐</div>
                    <h3>Избранное пусто</h3>
                    <p>Нажмите ☆ на любой монете, чтобы добавить её сюда</p>
                </div>`;
            return;
        }

        container.innerHTML = '<div class="loading">Загрузка избранного...</div>';

        // Fetch all tickers and filter by watchlist IDs
        const data = await cpGet('/tickers?quotes=USD', false);

        if (!data) {
            container.innerHTML = '<div class="loading">Ошибка загрузки. Попробуйте позже.</div>';
            return;
        }

        const coinMap = {};
        data.forEach(ticker => { 
            if (watchlist.includes(ticker.id)) {
                coinMap[ticker.id] = {
                    id: ticker.id,
                    name: ticker.name,
                    symbol: ticker.symbol,
                    rank: ticker.rank,
                    current_price: ticker.quotes.USD.price,
                    market_cap: ticker.quotes.USD.market_cap,
                    price_change_percentage_24h: ticker.quotes.USD.percent_change_24h,
                    total_volume: ticker.quotes.USD.volume_24h,
                    image: `https://static.coinpaprika.com/coin/${ticker.id}/logo.png`
                };
            }
        });

        const sortedCoins = watchlist
            .map(id => coinMap[id])
            .filter(coin => coin !== undefined);

        if (sortedCoins.length === 0) {
            container.innerHTML = '<div class="loading">Не удалось загрузить данные</div>';
            return;
        }

        container.innerHTML = sortedCoins.map(coin => createCoinCardHTML(coin, true)).join('');
    }

    function formatPrice(price) {
        if (price == null || isNaN(price)) return '0.00';
        if (price >= 1) return price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        if (price >= 0.01) return price.toFixed(4);
        return price.toFixed(8);
    }

    function formatNumber(num) {
        if (!num || isNaN(num)) return '0';
        if (num >= 1e12) return (num / 1e12).toFixed(2) + 'T';
        if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
        if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
        if (num >= 1e3) return (num / 1e3).toFixed(2) + 'K';
        return num.toLocaleString('en-US');
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function showToast(message, type) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast ' + (type || 'info') + ' show';

        if (toast._timeout) clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    document.getElementById('coinModal').addEventListener('click', function(e) {
        if (e.target === this) closeCoinDetailModal();
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && document.getElementById('coinModal').classList.contains('active')) {
            closeCoinDetailModal();
        }
    });

    if (tg) {
        tg.onEvent('themeChanged', function() {
            const theme = tg.themeParams;
            if (theme.bg_color) document.documentElement.style.setProperty('--bg-primary', theme.bg_color);
            if (theme.secondary_bg_color) document.documentElement.style.setProperty('--bg-secondary', theme.secondary_bg_color);
        });
    }

    console.log('App setup complete with CoinPaprika API');
    </script>
</body>
</html>
