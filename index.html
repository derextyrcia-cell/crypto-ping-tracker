<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="telegram-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>CryptoPulse Turbo</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <style>
        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #1a2332;
            --bg-card: #1e293b;
            --bg-hover: #273548;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --turbo: #ff6b35;
            --border: #334155;
            --radius: 12px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .header {
            background: var(--bg-secondary);
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .turbo-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .turbo-badge.active {
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            color: white;
            animation: pulse 2s infinite;
        }

        .turbo-badge.inactive {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .turbo-timer {
            font-size: 11px;
            margin-top: 4px;
            text-align: center;
            color: var(--turbo);
        }

        .nav-tabs {
            display: flex;
            background: var(--bg-secondary);
            padding: 8px;
            gap: 4px;
            position: sticky;
            top: 73px;
            z-index: 99;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .nav-tab {
            flex: 1;
            padding: 10px 8px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            min-width: fit-content;
        }

        .nav-tab.active {
            background: var(--accent);
            color: white;
        }

        .tab-content {
            display: none;
            padding: 16px;
            max-width: 800px;
            margin: 0 auto;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .turbo-panel {
            background: linear-gradient(135deg, rgba(255,107,53,0.1), rgba(255,140,66,0.1));
            border: 2px solid var(--turbo);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .turbo-panel h3 {
            color: var(--turbo);
            margin-bottom: 8px;
        }

        .turbo-panel .live-price {
            font-size: 48px;
            font-weight: 700;
            color: var(--turbo);
            margin: 10px 0;
            font-variant-numeric: tabular-nums;
        }

        .turbo-panel .live-change {
            font-size: 18px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 8px;
            display: inline-block;
        }

        .turbo-panel .timer-display {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 10px;
        }

        .turbo-chart-container {
            background: var(--bg-card);
            padding: 16px;
            border-radius: var(--radius);
            margin: 16px 0;
            height: 250px;
            position: relative;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            border-radius: var(--radius);
            font-size: 14px;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .filter-chips {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .filter-chip {
            padding: 6px 14px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .filter-chip.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .activate-turbo-btn {
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .activate-turbo-btn:hover {
            transform: scale(1.02);
        }

        .activate-turbo-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .stop-turbo-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            transition: transform 0.2s;
        }

        .coins-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .coin-card {
            background: var(--bg-card);
            padding: 12px 16px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .coin-card:hover {
            background: var(--bg-hover);
            border-color: var(--border);
        }

        .coin-card.tracking {
            border-color: var(--accent);
            background: linear-gradient(135deg, rgba(59,130,246,0.05), var(--bg-card));
        }

        .coin-symbol-box {
            background: var(--bg-secondary);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 14px;
            min-width: 70px;
            text-align: center;
        }

        .coin-info {
            flex: 1;
            min-width: 0;
        }

        .coin-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .coin-pair {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .coin-price-section {
            text-align: right;
        }

        .coin-price {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
        }

        .price-quote-icon {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .coin-change {
            font-size: 12px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
        }

        .coin-change.positive {
            color: var(--success);
            background: rgba(34, 197, 94, 0.1);
        }

        .coin-change.negative {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
        }

        .pair-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 16px;
        }

        .pair-stat {
            background: var(--bg-card);
            padding: 12px;
            border-radius: var(--radius-sm);
            text-align: center;
        }

        .pair-stat .label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .pair-stat .value {
            font-size: 14px;
            font-weight: 700;
        }

        .volume-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .volume-bar {
            flex: 1;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }

        .volume-bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            transition: width 0.3s;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 20px 0;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: var(--radius);
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .pairs-count {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-align: center;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 14px 24px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s ease;
            border: 1px solid var(--border);
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success { border-color: var(--success); background: rgba(34, 197, 94, 0.1); color: var(--success); }
        .toast.error { border-color: var(--danger); background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .toast.turbo { border-color: var(--turbo); background: rgba(255,107,53,0.1); color: var(--turbo); }

        .hidden { display: none !important; }
        .positive { color: var(--success); }
        .negative { color: var(--danger); }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .chart-timeframe-selector {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
            justify-content: center;
        }

        .chart-tf-btn {
            padding: 4px 10px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chart-tf-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        @media (max-width: 480px) {
            .nav-tab { font-size: 11px; padding: 8px 6px; }
            .turbo-panel .live-price { font-size: 36px; }
            .coin-symbol-box { min-width: 60px; font-size: 12px; padding: 6px 8px; }
            .turbo-chart-container { height: 200px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="header-content">
                <h1>💎 CryptoPulse</h1>
                <div>
                    <span class="turbo-badge inactive" id="turboBadge">🐢 Обычный режим</span>
                    <div class="turbo-timer" id="turboTimerDisplay"></div>
                </div>
            </div>
        </header>

        <nav class="nav-tabs">
            <button class="nav-tab active" data-tab="market">📊 Все пары</button>
            <button class="nav-tab" data-tab="turbo">🚀 Turbo</button>
            <button class="nav-tab" data-tab="watchlist">⭐ Избранное</button>
            <button class="nav-tab" data-tab="profile">👤 Профиль</button>
        </nav>

        <!-- Вкладка "Все пары" -->
        <div class="tab-content active" id="marketTab">
            <div class="search-box">
                <input type="text" id="pairSearchInput" placeholder="🔍 Поиск по названию или символу..." autocomplete="off">
            </div>
            <div class="filter-chips">
                <button class="filter-chip active" data-filter="all">Все</button>
                <button class="filter-chip" data-filter="USDT">💵 USDT</button>
                <button class="filter-chip" data-filter="BTC">₿ BTC</button>
                <button class="filter-chip" data-filter="ETH">⟠ ETH</button>
                <button class="filter-chip" data-filter="BNB">🟡 BNB</button>
                <button class="filter-chip" data-filter="FDUSD">💲 FDUSD</button>
                <button class="filter-chip" data-filter="gainers">📈 Рост</button>
                <button class="filter-chip" data-filter="volume">🔥 Объём</button>
            </div>
            <div class="pairs-count" id="pairsCount">Загрузка...</div>
            <div class="coins-list" id="allPairsList">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <div>Загрузка пар с Binance...</div>
                </div>
            </div>
        </div>

        <!-- Вкладка Turbo -->
        <div class="tab-content" id="turboTab">
            <div class="turbo-panel" id="turboPanel">
                <h3>🚀 Turbo Режим</h3>
                <p style="color: var(--text-secondary); margin-bottom: 10px;">
                    Цены и график в реальном времени через WebSocket
                </p>
                <div style="margin-bottom: 15px;">
                    <input type="text" id="turboSymbolInput" placeholder="Введите пару (например: btcusdt)" 
                           style="padding: 10px; border-radius: 8px; background: var(--bg-card); color: var(--text-primary); 
                                  border: 1px solid var(--border); width: 100%; text-align: center; font-size: 14px; text-transform: uppercase;">
                </div>
                <div class="live-price" id="livePrice">--</div>
                <div class="live-change positive" id="liveChange">--</div>
                <div class="timer-display" id="turboTimerInfo"></div>
                
                <!-- График в реальном времени -->
                <div class="turbo-chart-container">
                    <canvas id="realtimeChart"></canvas>
                </div>
                
                <div class="pair-stats" id="turboPairStats">
                    <div class="pair-stat">
                        <div class="label">High 24h</div>
                        <div class="value" id="turboHigh">--</div>
                    </div>
                    <div class="pair-stat">
                        <div class="label">Low 24h</div>
                        <div class="value" id="turboLow">--</div>
                    </div>
                    <div class="pair-stat">
                        <div class="label">Volume 24h</div>
                        <div class="value" id="turboVolume">--</div>
                    </div>
                    <div class="pair-stat">
                        <div class="label">Trades</div>
                        <div class="value" id="turboTrades">--</div>
                    </div>
                </div>
                <button class="activate-turbo-btn" id="activateTurboBtn" onclick="activateTurboSession()">
                    🚀 Активировать Turbo (15 мин)
                </button>
                <button class="stop-turbo-btn hidden" id="stopTurboBtn" onclick="stopTurboWebSocket()">
                    ⏹ Остановить Turbo
                </button>
            </div>
        </div>

        <!-- Вкладка "Избранное" -->
        <div class="tab-content" id="watchlistTab">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2>⭐ Отслеживаемые пары</h2>
                <button class="filter-chip" onclick="clearWatchlist()">🗑 Очистить</button>
            </div>
            <div class="coins-list" id="watchlistList">
                <div class="loading">Нет отслеживаемых пар</div>
            </div>
        </div>

        <!-- Вкладка "Профиль" -->
        <div class="tab-content" id="profileTab">
            <div class="stat-card" style="margin-bottom: 16px;">
                <div class="stat-value" id="watchlistCount">0</div>
                <div class="stat-label">Отслеживаемых пар</div>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="turboSessionsCount">0</div>
                    <div class="stat-label">Turbo сессий</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalPairsCount">0</div>
                    <div class="stat-label">Всего пар на Binance</div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    // ============ КОНСТАНТЫ ============
    const BINANCE_API = 'https://api.binance.com/api/v3';
    const BINANCE_WS_BASE = 'wss://stream.binance.com:9443/ws';
    
    let tg = window.Telegram?.WebApp || null;
    
    // Состояние приложения
    let allPairs = [];
    let pairPrices = {};
    let filteredPairs = [];
    let currentFilter = 'all';
    let searchQuery = '';
    
    // WebSocket и Turbo
    let cryptoSocket = null;
    let klineSocket = null;
    let turboTimer = null;
    let turboEndTime = null;
    let turboUpdateInterval = null;
    let currentTurboSymbol = '';
    
    // График
    let realtimeChart = null;
    let chartData = [];
    let maxChartPoints = 100;
    
    // Избранное и статистика
    let watchlist = [];
    let turboSessionsCount = 0;

    // Символы валют для отображения
    const QUOTE_SYMBOLS = {
        'USDT': '💲',
        'USDC': '💲',
        'BUSD': '💲',
        'FDUSD': '💲',
        'TUSD': '💲',
        'BTC': '₿',
        'ETH': '⟠',
        'BNB': '🟡',
        'XRP': '💧',
        'DOGE': '🐕',
        'SOL': '◎',
        'ADA': '🔷',
        'DOT': '⚫',
        'MATIC': '🟣'
    };

    // ============ ИНИЦИАЛИЗАЦИЯ ============
    document.addEventListener('DOMContentLoaded', async () => {
        console.log('CryptoPulse Dynamic Pairs with Chart initializing...');
        
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#0f1419');
            tg.setBackgroundColor('#0f1419');
        }
        
        watchlist = getStorage('watchlist', []);
        turboSessionsCount = getStorage('turbo_sessions', 0);
        
        const savedTurbo = getStorage('turbo_state', null);
        if (savedTurbo && savedTurbo.endTime > Date.now()) {
            const remainingMs = savedTurbo.endTime - Date.now();
            const remainingMinutes = Math.ceil(remainingMs / 60000);
            currentTurboSymbol = savedTurbo.symbol || '';
            document.getElementById('turboSymbolInput').value = currentTurboSymbol.toUpperCase();
            startTurboWebSocket(currentTurboSymbol);
            startKlineWebSocket(currentTurboSymbol);
            startTurboTimer(remainingMinutes);
        }
        
        initNavigation();
        initSearch();
        initFilterChips();
        await loadAllPairs();
        updateAllUI();
    });

    function getStorage(key, def) {
        try {
            const value = localStorage.getItem('cryptopulse_' + key);
            return value ? JSON.parse(value) : def;
        } catch (e) { return def; }
    }

    function setStorage(key, val) {
        try {
            localStorage.setItem('cryptopulse_' + key, JSON.stringify(val));
        } catch (e) {}
    }

    function updateAllUI() {
        document.getElementById('watchlistCount').textContent = watchlist.length;
        document.getElementById('turboSessionsCount').textContent = turboSessionsCount;
        document.getElementById('totalPairsCount').textContent = allPairs.length;
    }

    // ============ НАВИГАЦИЯ ============
    function initNavigation() {
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const tabName = tab.dataset.tab;
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tabName + 'Tab').classList.add('active');
                if (tabName === 'watchlist') renderWatchlist();
            });
        });
    }

    // ============ ЗАГРУЗКА ПАР С BINANCE ============
    async function loadAllPairs() {
        const container = document.getElementById('allPairsList');
        container.innerHTML = '<div class="loading"><div class="loading-spinner"></div><div>Загрузка всех пар с Binance...</div></div>';
        
        try {
            const exchangeInfo = await fetch(`${BINANCE_API}/exchangeInfo`).then(r => r.json());
            
            allPairs = exchangeInfo.symbols
                .filter(s => s.status === 'TRADING' && s.isSpotTradingAllowed)
                .map(s => ({
                    symbol: s.symbol,
                    baseAsset: s.baseAsset,
                    quoteAsset: s.quoteAsset,
                    baseAssetPrecision: s.baseAssetPrecision,
                    quotePrecision: s.quotePrecision
                }));
            
            console.log(`Загружено ${allPairs.length} активных пар`);
            document.getElementById('pairsCount').textContent = `Всего пар: ${allPairs.length} | Показано: ${allPairs.length}`;
            
            await loadAllPrices();
            
            filteredPairs = [...allPairs];
            applyCurrentFilters();
            updateAllUI();
        } catch (e) {
            console.error('Ошибка загрузки пар:', e);
            container.innerHTML = '<div class="loading">❌ Ошибка загрузки</div>';
        }
    }

    async function loadAllPrices() {
        try {
            const tickers = await fetch(`${BINANCE_API}/ticker/24hr`).then(r => r.json());
            tickers.forEach(t => {
                if (t.symbol && t.lastPrice) {
                    pairPrices[t.symbol] = {
                        price: parseFloat(t.lastPrice),
                        change: parseFloat(t.priceChangePercent),
                        high: parseFloat(t.highPrice),
                        low: parseFloat(t.lowPrice),
                        volume: parseFloat(t.volume),
                        quoteVolume: parseFloat(t.quoteVolume),
                        count: parseInt(t.count)
                    };
                }
            });
            console.log(`Загружены цены для ${Object.keys(pairPrices).length} пар`);
        } catch (e) {
            console.error('Ошибка загрузки цен:', e);
        }
    }

    // ============ ПОИСК И ФИЛЬТРАЦИЯ ============
    function initSearch() {
        const input = document.getElementById('pairSearchInput');
        let timer;
        input.addEventListener('input', () => {
            clearTimeout(timer);
            timer = setTimeout(() => {
                searchQuery = input.value.trim().toLowerCase();
                applyCurrentFilters();
            }, 300);
        });
    }

    function initFilterChips() {
        document.querySelectorAll('.filter-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentFilter = chip.dataset.filter;
                applyCurrentFilters();
            });
        });
    }

    function applyCurrentFilters() {
        let result = [...allPairs];
        
        if (['USDT', 'BTC', 'ETH', 'BNB', 'FDUSD'].includes(currentFilter)) {
            result = result.filter(p => p.quoteAsset === currentFilter);
        } else if (currentFilter === 'gainers') {
            result = result.filter(p => pairPrices[p.symbol]?.change > 0)
                .sort((a, b) => (pairPrices[b.symbol]?.change || 0) - (pairPrices[a.symbol]?.change || 0));
        } else if (currentFilter === 'volume') {
            result.sort((a, b) => (pairPrices[b.symbol]?.quoteVolume || 0) - (pairPrices[a.symbol]?.quoteVolume || 0));
        }
        
        if (searchQuery) {
            result = result.filter(p => 
                p.symbol.toLowerCase().includes(searchQuery) ||
                p.baseAsset.toLowerCase().includes(searchQuery) ||
                p.quoteAsset.toLowerCase().includes(searchQuery)
            );
        }
        
        filteredPairs = result;
        renderPairsList(filteredPairs);
        document.getElementById('pairsCount').textContent = 
            `Всего пар: ${allPairs.length} | Показано: ${filteredPairs.length}`;
    }

    // ============ ФОРМАТИРОВАНИЕ ЦЕНЫ С УЧЁТОМ ВАЛЮТЫ ============
    function getQuoteIcon(quoteAsset) {
        return QUOTE_SYMBOLS[quoteAsset] || quoteAsset.charAt(0);
    }

    function formatPriceForPair(price, pair) {
        if (price == null || isNaN(price)) return '0.00';
        
        // Для BTC пар показываем больше знаков
        if (pair.quoteAsset === 'BTC') {
            if (price < 0.000001) return price.toFixed(8);
            if (price < 0.0001) return price.toFixed(6);
            return price.toFixed(4);
        }
        
        // Для ETH пар
        if (pair.quoteAsset === 'ETH') {
            if (price < 0.001) return price.toFixed(6);
            return price.toFixed(4);
        }
        
        // Для стейблкоинов и USD пар
        if (price >= 1000) return price.toLocaleString('en-US', { maximumFractionDigits: 2 });
        if (price >= 1) return price.toFixed(2);
        if (price >= 0.01) return price.toFixed(4);
        return price.toFixed(6);
    }

    function getPricePrefix(quoteAsset) {
        // Не показываем $ для не-USDT пар
        if (['USDT', 'USDC', 'BUSD', 'FDUSD', 'TUSD'].includes(quoteAsset)) {
            return '$';
        }
        return '';
    }

    // ============ РЕНДЕРИНГ СПИСКА ПАР ============
    function renderPairsList(pairs) {
        const container = document.getElementById('allPairsList');
        
        if (!pairs.length) {
            container.innerHTML = '<div class="loading">😕 Пары не найдены</div>';
            return;
        }
        
        const displayPairs = pairs.slice(0, 200);
        
        container.innerHTML = displayPairs.map(pair => {
            const priceData = pairPrices[pair.symbol];
            const price = priceData?.price || 0;
            const change = priceData?.change || 0;
            const volume = priceData?.quoteVolume || 0;
            const isWatched = watchlist.includes(pair.symbol);
            const isTracking = currentTurboSymbol === pair.symbol.toLowerCase();
            const changeClass = change >= 0 ? 'positive' : 'negative';
            const quoteIcon = getQuoteIcon(pair.quoteAsset);
            const pricePrefix = getPricePrefix(pair.quoteAsset);
            
            const maxVolume = Math.max(...Object.values(pairPrices).map(p => p.quoteVolume || 0), 1);
            const volumePercent = Math.min((volume / maxVolume) * 100, 100);
            
            return `
            <div class="coin-card ${isTracking ? 'tracking' : ''}" onclick="selectPairForTurbo('${pair.symbol}')">
                <div class="coin-symbol-box">${pair.baseAsset}</div>
                <div class="coin-info">
                    <div class="coin-name">${pair.baseAsset}/${pair.quoteAsset}</div>
                    <div class="coin-pair">${pair.symbol}</div>
                    <div class="volume-indicator">
                        <div class="volume-bar">
                            <div class="volume-bar-fill" style="width: ${volumePercent}%"></div>
                        </div>
                        <span style="font-size: 10px; color: var(--text-secondary);">Vol</span>
                    </div>
                </div>
                <div class="coin-price-section">
                    <div class="coin-price">
                        <span class="price-quote-icon">${quoteIcon}</span>
                        ${pricePrefix}${formatPriceForPair(price, pair)}
                    </div>
                    <div class="coin-change ${changeClass}">${change >= 0 ? '+' : ''}${change.toFixed(2)}%</div>
                </div>
                <button class="watchlist-btn ${isWatched ? 'in-watchlist' : ''}" 
                        onclick="event.stopPropagation(); toggleWatchlist('${pair.symbol}')"
                        style="background:none;border:none;color:${isWatched ? '#f59e0b' : 'var(--text-secondary)'};font-size:20px;cursor:pointer;padding:4px;">
                    ${isWatched ? '⭐' : '☆'}
                </button>
            </div>`;
        }).join('');
        
        if (pairs.length > 200) {
            container.innerHTML += `<div class="loading" style="padding:20px;">Показано 200 из ${pairs.length} пар. Уточните поиск.</div>`;
        }
    }

    // ============ TURBO WEBSOCKET (ЦЕНА) ============
    function startTurboWebSocket(symbol) {
        if (!symbol) {
            showToast('Введите символ пары', 'error');
            return;
        }
        
        if (cryptoSocket) {
            cryptoSocket.close();
            cryptoSocket = null;
        }

        currentTurboSymbol = symbol.toLowerCase();
        const streamUrl = `${BINANCE_WS_BASE}/${currentTurboSymbol}@ticker`;
        
        console.log('[WebSocket Ticker] Подключение:', streamUrl);
        cryptoSocket = new WebSocket(streamUrl);

        cryptoSocket.onopen = () => {
            console.log('[WebSocket Ticker] Активен для', currentTurboSymbol.toUpperCase());
            updateTurboUIStatus(true);
            document.getElementById('activateTurboBtn').classList.add('hidden');
            document.getElementById('stopTurboBtn').classList.remove('hidden');
            showToast(`🚀 Turbo: ${currentTurboSymbol.toUpperCase()}`, 'turbo');
        };

        cryptoSocket.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                renderTurboUpdate(data);
                
                // Обновляем кеш
                if (pairPrices[currentTurboSymbol.toUpperCase()]) {
                    pairPrices[currentTurboSymbol.toUpperCase()].price = parseFloat(data.c);
                    pairPrices[currentTurboSymbol.toUpperCase()].change = parseFloat(data.P);
                }
            } catch (e) {
                console.error('[WebSocket] Parse error:', e);
            }
        };

        cryptoSocket.onerror = (error) => {
            console.error('[WebSocket] Error:', error);
        };

        cryptoSocket.onclose = (event) => {
            console.log('[WebSocket Ticker] Закрыт:', event.code);
            if (turboEndTime && Date.now() < turboEndTime) {
                console.log('[WebSocket] Переподключение ticker...');
                setTimeout(() => startTurboWebSocket(currentTurboSymbol), 2000);
            } else {
                updateTurboUIStatus(false);
                document.getElementById('activateTurboBtn').classList.remove('hidden');
                document.getElementById('stopTurboBtn').classList.add('hidden');
            }
        };
    }

    // ============ KLINE WEBSOCKET (ГРАФИК) ============
    function startKlineWebSocket(symbol) {
        if (klineSocket) {
            klineSocket.close();
            klineSocket = null;
        }

        const streamUrl = `${BINANCE_WS_BASE}/${symbol.toLowerCase()}@kline_1m`;
        
        console.log('[WebSocket Kline] Подключение:', streamUrl);
        klineSocket = new WebSocket(streamUrl);

        klineSocket.onopen = () => {
            console.log('[WebSocket Kline] Поток графика активен');
            // Загружаем исторические данные для графика
            loadHistoricalKlines(symbol);
        };

        klineSocket.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                const kline = data.k;
                
                if (kline.x) { // Свеча закрыта
                    addChartPoint({
                        time: kline.t,
                        open: parseFloat(kline.o),
                        high: parseFloat(kline.h),
                        low: parseFloat(kline.l),
                        close: parseFloat(kline.c)
                    });
                } else {
                    // Обновляем текущую свечу
                    updateLastChartPoint({
                        time: kline.t,
                        close: parseFloat(kline.c),
                        high: parseFloat(kline.h),
                        low: parseFloat(kline.l)
                    });
                }
            } catch (e) {
                console.error('[Kline] Parse error:', e);
            }
        };

        klineSocket.onclose = () => {
            console.log('[WebSocket Kline] Закрыт');
        };
    }

    async function loadHistoricalKlines(symbol) {
        try {
            const res = await fetch(`${BINANCE_API}/klines?symbol=${symbol.toUpperCase()}&interval=1m&limit=100`);
            const klines = await res.json();
            
            chartData = klines.map(k => ({
                time: k[0],
                open: parseFloat(k[1]),
                high: parseFloat(k[2]),
                low: parseFloat(k[3]),
                close: parseFloat(k[4])
            }));
            
            initRealtimeChart();
        } catch (e) {
            console.error('Ошибка загрузки исторических данных:', e);
            chartData = [];
            initRealtimeChart();
        }
    }

    function addChartPoint(point) {
        chartData.push(point);
        if (chartData.length > maxChartPoints) {
            chartData.shift();
        }
        updateChart();
    }

    function updateLastChartPoint(update) {
        if (chartData.length === 0) return;
        const last = chartData[chartData.length - 1];
        if (last.time === update.time) {
            last.close = update.close;
            last.high = Math.max(last.high, update.high);
            last.low = Math.min(last.low, update.low);
        }
        updateChart();
    }

    function initRealtimeChart() {
        const canvas = document.getElementById('realtimeChart');
        if (!canvas) return;

        if (realtimeChart) {
            realtimeChart.destroy();
            realtimeChart = null;
        }

        const ctx = canvas.getContext('2d');
        
        const labels = chartData.map(d => new Date(d.time).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }));
        const prices = chartData.map(d => d.close);

        realtimeChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: currentTurboSymbol.toUpperCase(),
                    data: prices,
                    borderColor: '#ff6b35',
                    backgroundColor: 'rgba(255, 107, 53, 0.1)',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 4,
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: {
                    duration: 0
                },
                interaction: {
                    intersect: false,
                    mode: 'index'
                },
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        backgroundColor: '#1e293b',
                        titleColor: '#f1f5f9',
                        bodyColor: '#f1f5f9',
                        borderColor: '#334155',
                        borderWidth: 1,
                        callbacks: {
                            label: (ctx) => {
                                const pair = allPairs.find(p => p.symbol === currentTurboSymbol.toUpperCase());
                                const prefix = pair ? getPricePrefix(pair.quoteAsset) : '$';
                                return prefix + formatPriceForPair(ctx.parsed.y, pair || { quoteAsset: 'USDT' });
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        grid: {
                            color: '#334155',
                            drawBorder: false
                        },
                        ticks: {
                            color: '#94a3b8',
                            maxTicksLimit: 8,
                            maxRotation: 0
                        }
                    },
                    y: {
                        grid: {
                            color: '#334155',
                            drawBorder: false
                        },
                        ticks: {
                            color: '#94a3b8',
                            callback: (v) => {
                                const pair = allPairs.find(p => p.symbol === currentTurboSymbol.toUpperCase());
                                return (pair ? getPricePrefix(pair.quoteAsset) : '') + formatPriceForPair(v, pair || { quoteAsset: 'USDT' });
                            }
                        }
                    }
                }
            }
        });
    }

    function updateChart() {
        if (!realtimeChart) {
            initRealtimeChart();
            return;
        }

        const labels = chartData.map(d => new Date(d.time).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }));
        const prices = chartData.map(d => d.close);

        realtimeChart.data.labels = labels;
        realtimeChart.data.datasets[0].data = prices;
        realtimeChart.update('none');
    }

    // ============ АКТИВАЦИЯ/ДЕАКТИВАЦИЯ TURBO ============
    function activateTurboSession(durationMinutes = 15) {
        let symbol = document.getElementById('turboSymbolInput').value.trim().toUpperCase();
        
        if (!symbol) {
            showToast('Введите символ пары (например: BTCUSDT)', 'error');
            return;
        }
        
        if (!allPairs.find(p => p.symbol === symbol)) {
            showToast(`Пара ${symbol} не найдена на Binance`, 'error');
            return;
        }
        
        currentTurboSymbol = symbol.toLowerCase();
        
        // Очищаем старый график
        if (realtimeChart) {
            realtimeChart.destroy();
            realtimeChart = null;
        }
        chartData = [];
        
        startTurboWebSocket(symbol);
        startKlineWebSocket(symbol);
        startTurboTimer(durationMinutes);
        
        const endTime = Date.now() + durationMinutes * 60 * 1000;
        setStorage('turbo_state', {
            symbol: symbol.toLowerCase(),
            endTime: endTime,
            duration: durationMinutes
        });
        
        turboSessionsCount++;
        setStorage('turbo_sessions', turboSessionsCount);
        document.getElementById('turboSessionsCount').textContent = turboSessionsCount;
    }

    function stopTurboWebSocket() {
        if (cryptoSocket) {
            cryptoSocket.close();
            cryptoSocket = null;
        }
        if (klineSocket) {
            klineSocket.close();
            klineSocket = null;
        }
        if (turboTimer) {
            clearTimeout(turboTimer);
            turboTimer = null;
        }
        if (turboUpdateInterval) {
            clearInterval(turboUpdateInterval);
            turboUpdateInterval = null;
        }
        
        if (realtimeChart) {
            realtimeChart.destroy();
            realtimeChart = null;
        }
        
        turboEndTime = null;
        currentTurboSymbol = '';
        chartData = [];
        
        updateTurboUIStatus(false);
        document.getElementById('activateTurboBtn').classList.remove('hidden');
        document.getElementById('stopTurboBtn').classList.add('hidden');
        document.getElementById('livePrice').textContent = '--';
        document.getElementById('liveChange').textContent = '--';
        document.getElementById('turboTimerInfo').textContent = '';
        document.getElementById('turboHigh').textContent = '--';
        document.getElementById('turboLow').textContent = '--';
        document.getElementById('turboVolume').textContent = '--';
        document.getElementById('turboTrades').textContent = '--';
        
        setStorage('turbo_state', null);
        showToast('Turbo режим остановлен', 'error');
    }

    function startTurboTimer(durationMinutes) {
        turboEndTime = Date.now() + durationMinutes * 60 * 1000;
        
        if (turboUpdateInterval) clearInterval(turboUpdateInterval);
        
        const updateTimer = () => {
            const remaining = turboEndTime - Date.now();
            if (remaining <= 0) {
                stopTurboWebSocket();
                showToast('⏰ Turbo истек. Активируйте снова!', 'error');
                return;
            }
            
            const m = Math.floor(remaining / 60000);
            const s = Math.floor((remaining % 60000) / 1000);
            document.getElementById('turboTimerInfo').textContent = `⏱ ${m}:${s.toString().padStart(2, '0')}`;
            document.getElementById('turboTimerDisplay').textContent = `${m}:${s.toString().padStart(2, '0')}`;
        };
        
        updateTimer();
        turboUpdateInterval = setInterval(updateTimer, 1000);
        
        if (turboTimer) clearTimeout(turboTimer);
        turboTimer = setTimeout(() => {
            stopTurboWebSocket();
            showToast('⏰ Turbo истек!', 'error');
        }, durationMinutes * 60 * 1000);
    }

    function renderTurboUpdate(data) {
        const price = parseFloat(data.c);
        const changePercent = parseFloat(data.P);
        const high = parseFloat(data.h);
        const low = parseFloat(data.l);
        const quoteVolume = parseFloat(data.q);
        const trades = parseInt(data.n);
        
        const pair = allPairs.find(p => p.symbol === currentTurboSymbol.toUpperCase());
        const prefix = pair ? getPricePrefix(pair.quoteAsset) : '$';
        const quoteIcon = pair ? getQuoteIcon(pair.quoteAsset) : '💲';
        
        document.getElementById('livePrice').textContent = 
            `${quoteIcon} ${prefix}${formatPriceForPair(price, pair || { quoteAsset: 'USDT' })}`;
        
        const changeEl = document.getElementById('liveChange');
        changeEl.textContent = (changePercent >= 0 ? '+' : '') + changePercent.toFixed(2) + '%';
        changeEl.className = 'live-change ' + (changePercent >= 0 ? 'positive' : 'negative');
        
        document.getElementById('turboHigh').textContent = prefix + formatPriceForPair(high, pair || { quoteAsset: 'USDT' });
        document.getElementById('turboLow').textContent = prefix + formatPriceForPair(low, pair || { quoteAsset: 'USDT' });
        document.getElementById('turboVolume').textContent = formatVolume(quoteVolume);
        document.getElementById('turboTrades').textContent = trades.toLocaleString();
    }

    function updateTurboUIStatus(isActive) {
        const badge = document.getElementById('turboBadge');
        if (isActive) {
            badge.textContent = '🚀 Turbo АКТИВЕН';
            badge.className = 'turbo-badge active';
        } else {
            badge.textContent = '🐢 Обычный режим';
            badge.className = 'turbo-badge inactive';
            document.getElementById('turboTimerDisplay').textContent = '';
        }
    }

    function selectPairForTurbo(symbol) {
        document.getElementById('turboSymbolInput').value = symbol;
        
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.querySelector('[data-tab="turbo"]').classList.add('active');
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById('turboTab').classList.add('active');
        
        currentTurboSymbol = symbol.toLowerCase();
        activateTurboSession();
    }

    // ============ ИЗБРАННОЕ ============
    function toggleWatchlist(symbol) {
        const index = watchlist.indexOf(symbol);
        if (index > -1) {
            watchlist.splice(index, 1);
            showToast(`Удалено: ${symbol}`, 'success');
        } else {
            if (watchlist.length >= 50) {
                showToast('Лимит: 50 пар', 'error');
                return;
            }
            watchlist.push(symbol);
            showToast(`Добавлено: ${symbol} ⭐`, 'success');
        }
        
        setStorage('watchlist', watchlist);
        updateAllUI();
        applyCurrentFilters();
        renderWatchlist();
    }

    function clearWatchlist() {
        if (!watchlist.length) return showToast('Избранное пусто', 'error');
        if (confirm('Удалить все пары из избранного?')) {
            watchlist = [];
            setStorage('watchlist', watchlist);
            updateAllUI();
            applyCurrentFilters();
            renderWatchlist();
            showToast('Избранное очищено', 'success');
        }
    }

    function renderWatchlist() {
        const container = document.getElementById('watchlistList');
        if (!watchlist.length) {
            container.innerHTML = '<div class="loading">⭐ Нет отслеживаемых пар</div>';
            return;
        }
        
        const pairs = watchlist.map(symbol => {
            const pair = allPairs.find(p => p.symbol === symbol);
            return pair || { symbol, baseAsset: symbol, quoteAsset: '?' };
        });
        
        if (!pairs.length) {
            container.innerHTML = '<div class="loading">Нет данных</div>';
            return;
        }
        
        container.innerHTML = pairs.map(pair => {
            const priceData = pairPrices[pair.symbol];
            const price = priceData?.price || 0;
            const change = priceData?.change || 0;
            const changeClass = change >= 0 ? 'positive' : 'negative';
            const quoteIcon = getQuoteIcon(pair.quoteAsset);
            const pricePrefix = getPricePrefix(pair.quoteAsset);
            
            return `
            <div class="coin-card" onclick="selectPairForTurbo('${pair.symbol}')">
                <div class="coin-symbol-box">${pair.baseAsset}</div>
                <div class="coin-info">
                    <div class="coin-name">${pair.baseAsset}/${pair.quoteAsset}</div>
                    <div class="coin-pair">${pair.symbol}</div>
                </div>
                <div class="coin-price-section">
                    <div class="coin-price">
                        <span class="price-quote-icon">${quoteIcon}</span>
                        ${pricePrefix}${formatPriceForPair(price, pair)}
                    </div>
                    <div class="coin-change ${changeClass}">${change >= 0 ? '+' : ''}${change.toFixed(2)}%</div>
                </div>
                <button class="watchlist-btn in-watchlist" 
                        onclick="event.stopPropagation(); toggleWatchlist('${pair.symbol}')"
                        style="background:none;border:none;color:#f59e0b;font-size:20px;cursor:pointer;">⭐</button>
            </div>`;
        }).join('');
    }

    // ============ УТИЛИТЫ ============
    function formatVolume(vol) {
        if (!vol || isNaN(vol)) return '0';
        if (vol >= 1e9) return (vol / 1e9).toFixed(2) + 'B';
        if (vol >= 1e6) return (vol / 1e6).toFixed(2) + 'M';
        if (vol >= 1e3) return (vol / 1e3).toFixed(2) + 'K';
        return vol.toFixed(2);
    }

    function showToast(message, type) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast ' + (type || 'info') + ' show';
        if (toast._timeout) clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    window.addEventListener('beforeunload', () => {
        if (cryptoSocket) cryptoSocket.close();
        if (klineSocket) klineSocket.close();
        if (turboTimer) clearTimeout(turboTimer);
        if (turboUpdateInterval) clearInterval(turboUpdateInterval);
        if (realtimeChart) realtimeChart.destroy();
    });

    console.log('✅ CryptoPulse с графиком WebSocket готов');
    </script>
</body>
